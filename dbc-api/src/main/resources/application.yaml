spring:
  application:
    name: dbc-api
  datasource:
    url: jdbc:postgresql://localhost:5432/dbc_db
    default_schema: dbc
    username:
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  logging:
    level:
      org:
        hibernate:
          SQL: DEBUG